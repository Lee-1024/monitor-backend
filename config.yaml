redis:
  addr: "10.54.56.54:30379"
  password: "admin123456"
  db: 0

# 进程和 Docker 历史快照存储。ClickHouse 已部署时填写实际地址并启用。
clickhouse:
  enabled: false
  address: "http://clickhouse:8123"
  database: "monitor"
  username: "default"
  password: ""
  dial_timeout_seconds: 5
  write_timeout_seconds: 30
  batch_rows: 5000
  flush_interval_seconds: 5
  retention_days: 30

snapshot_storage:
  redis_history_hours: 24
  stream_max_len: 200000
  consumer_group: "snapshot-clickhouse"
  consumer_name: "monitor-backend"

retention:
  # 批量删除限流参数，供日志、服务状态等按 DELETE 清理的表使用。
  cleanup_batch_size: 500
  # 每一轮清理最多执行多少个删除批次，供按 DELETE 清理的表使用。
  cleanup_max_batches_per_run: 1
  # 进程/Docker 快照 TRUNCATE 定时任务执行间隔，单位秒。
  cleanup_interval_seconds: 60
  # 后台服务启动/重启后的保护期，单位秒。保护期内只触发后台健康告警，不触发所有主机的宕机告警。
  backend_startup_grace_seconds: 180

logging:
  level: "info"                 # debug, info, warn, error
  gorm_level: "error"           # silent, error, warn, info
  ignore_record_not_found: true # suppress expected gorm.ErrRecordNotFound SQL logs

jwt_secret: "bbcceewwx1234567890"
# 是否要求认证，设置为false可以在开发环境中禁用认证
auth_required: true

coroot:
  enabled: false
  # Coroot 使用 --url-base-path=/coroot/ 时，后端地址也要包含 /coroot
  base_url: "http://10.40.0.184:8082/coroot"
  public_base_url: "/coroot/"
  project_id: "92faob1m"
  api_key: ""
  webhook_secret: ""
  timeout_seconds: 3
  cache_enabled: true
  verify_tls: true

# LLM配置（可选，用于智能分析和成本优化建议）
llm:
  enabled: false  # 是否启用LLM功能
  provider: "openai"  # openai, claude, custom
  api_key: ""  # LLM API密钥
  base_url: ""  # 自定义API地址（可选，用于custom provider）
  model: "gpt-3.5-turbo"  # 模型名称
  temperature: 0.7  # 温度参数（0-1）
  max_tokens: 8000  # 最大token数（默认8000，确保巡检日报等长文本生成完整）
  timeout: 30  # 超时时间（秒）
